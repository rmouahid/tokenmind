[tool.poetry]
name = "tokenmind"
version = "0.1.0"
description = "Finds the most token-efficient representation to give information to an LLM without degrading its answers"
authors = ["rmouahid"]
license = "MIT"
readme = "README.md"
packages = [{ include = "tokenmind" }]

[tool.poetry.scripts]
tokenmind = "tokenmind.cli:app"

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28.1"
typer = "^0.27.3"
tiktoken = "^0.14.0"
tokenizers = "^0.23.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
